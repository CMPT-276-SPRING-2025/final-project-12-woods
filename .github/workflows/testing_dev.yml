name: Testing dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './foodiefind/package-lock.json'

      - name: Install Dependencies
        working-directory: ./foodiefind
        run: npm install

      - name: Lint
        working-directory: ./foodiefind
        run: npm run lint

      - name: Build Project
        working-directory: ./foodiefind
        run: npm run build

      - name: Test Project
        working-directory: ./foodiefind
        run: npm run test -- --run

